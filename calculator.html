<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #d9dccf;
    --body: #3d4a43;
    --body-edge: #2c3631;
    --lcd: #b9c6a4;
    --lcd-ink: #1f2a1c;
    --lcd-dim: #55634d;
    --key: #ecebe3;
    --key-ink: #26302b;
    --key-shadow: #a9ab9e;
    --op: #5d6f63;
    --op-ink: #f2f3ec;
    --op-shadow: #26302b;
    --eq: #e0a92e;
    --eq-ink: #2a2310;
    --eq-shadow: #9a7317;
    --focus: #e0a92e;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #161a17;
      --body: #2b332e;
      --body-edge: #1d2320;
      --lcd: #9fae8a;
      --key: #454f49;
      --key-ink: #eef0e8;
      --key-shadow: #1a1f1c;
      --op: #627567;
      --op-shadow: #1a1f1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #161a17;
    --body: #2b332e;
    --body-edge: #1d2320;
    --lcd: #9fae8a;
    --key: #454f49;
    --key-ink: #eef0e8;
    --key-shadow: #1a1f1c;
    --op: #627567;
    --op-shadow: #1a1f1c;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    background: var(--page);
    font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 1.5rem 1rem;
  }
  .calc {
    width: 100%;
    max-width: 22rem;
    background: var(--body);
    border-radius: 1.75rem 1.75rem 2.25rem 2.25rem;
    padding: 1.4rem 1.2rem 1.5rem;
    box-shadow: 0 0.5rem 0 var(--body-edge), 0 1.5rem 2.5rem rgba(20, 28, 22, 0.35);
  }
  .screen {
    background: var(--lcd);
    border-radius: 0.6rem;
    padding: 0.8rem 1rem 0.7rem;
    margin-bottom: 1.3rem;
    box-shadow: inset 0 0.2rem 0.5rem rgba(0, 0, 0, 0.25);
    font-family: "Chivo Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-align: right;
    overflow: hidden;
  }
  .expr {
    color: var(--lcd-dim);
    font-size: 0.95rem;
    min-height: 1.4em;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .expr::-webkit-scrollbar { display: none; }
  .result {
    color: var(--lcd-ink);
    font-size: 2.6rem;
    font-weight: 500;
    line-height: 1.15;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    transition: font-size 0.1s;
  }
  .result::-webkit-scrollbar { display: none; }
  .result.long { font-size: 1.8rem; }
  .result.error { font-size: 1.4rem; }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.7rem;
  }
  button {
    font: inherit;
    font-size: 1.35rem;
    font-weight: 500;
    border: 0;
    border-radius: 0.9rem;
    height: 3.6rem;
    cursor: pointer;
    background: var(--key);
    color: var(--key-ink);
    box-shadow: 0 0.3rem 0 var(--key-shadow);
    transform: translateY(0);
    transition: transform 0.06s, box-shadow 0.06s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button.op { background: var(--op); color: var(--op-ink); box-shadow: 0 0.3rem 0 var(--op-shadow); }
  button.fn { font-size: 1.1rem; }
  button.eq {
    background: var(--eq);
    color: var(--eq-ink);
    box-shadow: 0 0.3rem 0 var(--eq-shadow);
    grid-row: span 2;
    height: auto;
    font-size: 1.7rem;
  }
  button.zero { grid-column: span 2; }
  button:active, button.pressed { transform: translateY(0.3rem); box-shadow: 0 0 0 transparent; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button, .result { transition: none; } }
  @media (max-width: 360px) {
    .calc { padding: 1.1rem 0.9rem 1.2rem; }
    .keys { gap: 0.5rem; }
    button { height: 3.2rem; font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="screen">
      <div class="expr" id="expr" aria-live="polite"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>
    <div class="keys">
      <button class="op fn" data-action="clear" aria-label="Clear">AC</button>
      <button class="op fn" data-action="back" aria-label="Delete last">⌫</button>
      <button class="op fn" data-action="percent" aria-label="Percent">%</button>
      <button class="op" data-op="/" aria-label="Divide">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*" aria-label="Multiply">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-" aria-label="Subtract">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+" aria-label="Add">+</button>

      <button class="fn" data-action="sign" aria-label="Change sign">±</button>
      <button data-num="0">0</button>
      <button data-num=".">.</button>
      <button class="eq" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

<script>
(function () {
  const exprEl = document.getElementById("expr");
  const resultEl = document.getElementById("result");
  const SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  // tokens: numbers as strings, operators as "+", "-", "*", "/"
  let tokens = [];
  let current = "0";
  let justEvaluated = false;
  let errored = false;

  function format(n) {
    if (!isFinite(n)) return "Can’t divide by 0";
    let s = parseFloat(n.toPrecision(12)).toString();
    if (s.includes("e")) return s;
    const [int, dec] = s.split(".");
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return dec ? grouped + "." + dec : grouped;
  }

  function formatEntry(str) {
    if (str === "-" ) return "−";
    const neg = str.startsWith("-");
    const body = neg ? str.slice(1) : str;
    const [int, dec] = body.split(".");
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + grouped + (dec !== undefined ? "." + dec : "");
  }

  function render() {
    exprEl.textContent = tokens.map(t => SYMBOL[t] || formatEntry(t)).join(" ");
    const text = errored ? current : formatEntry(current);
    resultEl.textContent = text;
    resultEl.classList.toggle("long", !errored && text.length > 11);
    resultEl.classList.toggle("error", errored);
    resultEl.scrollLeft = resultEl.scrollWidth;
    exprEl.scrollLeft = exprEl.scrollWidth;
  }

  function compute(list) {
    // two passes for precedence: × ÷ first, then + −
    const vals = [parseFloat(list[0])];
    const ops = [];
    for (let i = 1; i < list.length; i += 2) {
      const op = list[i], v = parseFloat(list[i + 1]);
      if (op === "*") vals[vals.length - 1] *= v;
      else if (op === "/") vals[vals.length - 1] /= v;
      else { ops.push(op); vals.push(v); }
    }
    let total = vals[0];
    ops.forEach((op, i) => { total = op === "+" ? total + vals[i + 1] : total - vals[i + 1]; });
    return total;
  }

  function resetIfError() {
    if (errored) { tokens = []; current = "0"; errored = false; }
  }

  function inputNum(d) {
    resetIfError();
    if (justEvaluated) { tokens = []; current = "0"; justEvaluated = false; }
    if (d === ".") {
      if (current.includes(".")) return;
      current += ".";
    } else if (current === "0") current = d;
    else if (current === "-0") current = "-" + d;
    else if (current.replace(/[-.]/g, "").length < 15) current += d;
  }

  function inputOp(op) {
    resetIfError();
    justEvaluated = false;
    if (current === "" && tokens.length) {
      tokens[tokens.length - 1] = op; // swap operator
    } else {
      tokens.push(current, op);
      current = "";
    }
    // show running value
    const partial = tokens.slice(0, -1);
    exprEl.dataset.preview = format(compute(partial));
  }

  function equals() {
    if (errored) return;
    if (current === "") tokens.pop();
    else tokens.push(current);
    if (!tokens.length) return;
    const val = compute(tokens);
    exprEl.textContent = "";
    tokens = tokens.concat("=");
    const shown = tokens.map(t => SYMBOL[t] || (t === "=" ? "=" : formatEntry(t))).join(" ");
    tokens = [];
    if (!isFinite(val)) {
      current = "Can’t divide by 0";
      errored = true;
    } else {
      current = parseFloat(val.toPrecision(12)).toString();
    }
    justEvaluated = true;
    render();
    exprEl.textContent = shown;
    return true;
  }

  function action(a) {
    if (a === "clear") { tokens = []; current = "0"; errored = false; justEvaluated = false; }
    else if (a === "back") {
      if (errored || justEvaluated) { tokens = []; current = "0"; errored = false; justEvaluated = false; }
      else if (current === "" && tokens.length) { tokens.pop(); current = tokens.pop(); }
      else {
        current = current.slice(0, -1);
        if (current === "" || current === "-") current = tokens.length ? "" : "0";
      }
    }
    else if (a === "sign") {
      resetIfError();
      justEvaluated = false;
      if (current === "") current = "-";
      else if (current === "-") current = "";
      else current = current.startsWith("-") ? current.slice(1) : "-" + current;
    }
    else if (a === "percent") {
      resetIfError();
      if (current && current !== "-") current = parseFloat((parseFloat(current) / 100).toPrecision(12)).toString();
    }
    else if (a === "equals") { equals(); return; }
    render();
  }

  document.querySelector(".keys").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.num) inputNum(b.dataset.num), render();
    else if (b.dataset.op) inputOp(b.dataset.op), render();
    else action(b.dataset.action);
  });

  const keyMap = {
    "Enter": "equals", "=": "equals", "Escape": "clear", "Delete": "clear",
    "Backspace": "back", "%": "percent"
  };

  function flash(selector) {
    const b = document.querySelector(selector);
    if (!b) return;
    b.classList.add("pressed");
    setTimeout(() => b.classList.remove("pressed"), 90);
  }

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key === "," ? "." : e.key;
    if (/^[0-9.]$/.test(k)) { inputNum(k); render(); flash(`[data-num="${k}"]`); }
    else if ("+-*/".includes(k) && k.length === 1) { inputOp(k); render(); flash(`[data-op="${k}"]`); }
    else if (k === "x" || k === "X") { inputOp("*"); render(); flash('[data-op="*"]'); }
    else if (keyMap[k]) { action(keyMap[k]); flash(`[data-action="${keyMap[k]}"]`); }
    else return;
    e.preventDefault();
  });

  render();
})();
</script>
</body>
</html>
