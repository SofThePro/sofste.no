<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #0f2027);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #cookie-count {
            font-size: 2rem;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 5px;
        }

        #cps-count {
            font-size: 1.1rem;
            color: #bdc3c7;
            margin-bottom: 25px;
        }

        .cookie-wrapper {
            margin: 30px 0;
        }

        /* Enkel CSS-kjeks i stedet for eksternt bilde */
        #cookie {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #d35400 20%, #e67e22 100%);
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.05s ease;
            border: 8px solid #ba68c8; /* Glasering-look */
            box-sizing: border-box;
        }

        /* Sjokoladebiter på kjeksen */
        #cookie::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background-image: 
                radial-gradient(circle, #3e2723 10px, transparent 11px),
                radial-gradient(circle, #3e2723 8px, transparent 9px),
                radial-gradient(circle, #3e2723 12px, transparent 13px),
                radial-gradient(circle, #3e2723 7px, transparent 8px);
            background-position: 40px 50px, 120px 40px, 80px 110px, 130px 120px;
            background-repeat: no-repeat;
        }

        #cookie:active {
            transform: scale(0.95);
        }

        .upgrades-container {
            margin-top: 30px;
            text-align: left;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .upgrade-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .upgrade-info p {
            margin: 0;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .upgrade-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upgrade-btn:hover {
            background-color: #2ecc71;
        }

        .upgrade-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Kjeksklikker</h1>
        <div id="cookie-count">0 kjeks</div>
        <div id="cps-count">Kjeks per sekund (CPS): 0</div>

        <div class="cookie-wrapper">
            <div id="cookie"></div>
        </div>

        <div class="upgrades-container">
            <h2>Butikk</h2>
            
            <!-- Oppgradering 1: Klikk-kraft -->
            <div class="upgrade-item">
                <div class="upgrade-info">
                    <h3>Superfingre (<span id="upg1-count">0</span>)</h3>
                    <p>Gir +1 kjeks per klikk</p>
                </div>
                <button class="upgrade-btn" id="upg1-btn" onclick="buyClickUpgrade()">Pris: 15</button>
            </div>

            <!-- Oppgradering 2: Auto-klikkere -->
            <div class="upgrade-item">
                <div class="upgrade-info">
                    <h3>Bestemor (<span id="upg2-count">0</span>)</h3>
                    <p>Baker 1 kjeks i sekundet</p>
                </div>
                <button class="upgrade-btn" id="upg2-btn" onclick="buyGrandma()">Pris: 100</button>
            </div>

            <!-- Oppgradering 3: Kjeksefabrikk -->
            <div class="upgrade-item">
                <div class="upgrade-info">
                    <h3>Fabrikk (<span id="upg3-count">0</span>)</h3>
                    <p>Produserer 10 kjeks i sekundet</p>
                </div>
                <button class="upgrade-btn" id="upg3-btn" onclick="buyFactory()">Pris: 1000</button>
            </div>
        </div>
    </div>

    <script>
        // Spillvariabler (Spilltilstand)
        let cookies = 0;
        let cookiesPerClick = 1;
        let cookiesPerSecond = 0;

        // Priser og antall
        let clickUpgradeCost = 15;
        let clickUpgradeCount = 0;

        let grandmaCost = 100;
        let grandmaCount = 0;

        let factoryCost = 1000;
        let factoryCount = 0;

        // DOM-elementer
        const cookieDisplay = document.getElementById('cookie-count');
        const cpsDisplay = document.getElementById('cps-count');
        const cookieElement = document.getElementById('cookie');

        const upg1Btn = document.getElementById('upg1-btn');
        const upg1CountDisplay = document.getElementById('upg1-count');

        const upg2Btn = document.getElementById('upg2-btn');
        const upg2CountDisplay = document.getElementById('upg2-count');

        const upg3Btn = document.getElementById('upg3-btn');
        const upg3CountDisplay = document.getElementById('upg3-count');

        // Klikk på hovedkjeksen
        cookieElement.addEventListener('click', () => {
            cookies += cookiesPerClick;
            updateDisplay();
        });

        // Kjøp sterkere klikk
        function buyClickUpgrade() {
            if (cookies >= clickUpgradeCost) {
                cookies -= clickUpgradeCost;
                cookiesPerClick += 1;
                clickUpgradeCount++;
                clickUpgradeCost = Math.round(clickUpgradeCost * 1.15); // Prisen øker med 15%
                
                updateDisplay();
            }
        }

        // Kjøp Bestemor (CPS)
        function buyGrandma() {
            if (cookies >= grandmaCost) {
                cookies -= grandmaCost;
                cookiesPerSecond += 1;
                grandmaCount++;
                grandmaCost = Math.round(grandmaCost * 1.15);
                
                updateDisplay();
            }
        }

        // Kjøp Fabrikk (CPS)
        function buyFactory() {
            if (cookies >= factoryCost) {
                cookies -= factoryCost;
                cookiesPerSecond += 10;
                factoryCount++;
                factoryCost = Math.round(factoryCost * 1.15);
                
                updateDisplay();
            }
        }

        // Oppdater tekst og knapper på skjermen
        function updateDisplay() {
            cookieDisplay.textContent = Math.floor(cookies) + " kjeks";
            cpsDisplay.textContent = "Kjeks per sekund (CPS): " + cookiesPerSecond;

            // Oppdater oppgradering 1
            upg1CountDisplay.textContent = clickUpgradeCount;
            upg1Btn.textContent = "Pris: " + clickUpgradeCost;
            upg1Btn.disabled = cookies < clickUpgradeCost;

            // Oppdater oppgradering 2
            upg2CountDisplay.textContent = grandmaCount;
            upg2Btn.textContent = "Pris: " + grandmaCost;
            upg2Btn.disabled = cookies < grandmaCost;

            // Oppdater oppgradering 3
            upg3CountDisplay.textContent = factoryCount;
            upg3Btn.textContent = "Pris: " + factoryCost;
            upg3Btn.disabled = cookies < factoryCost;
        }

        // Hovedløkke for spillet: Legger til kjeks basert på CPS hvert sekund (kjører 10 ganger i sekundet for jevn oppdatering)
        setInterval(() => {
            if (cookiesPerSecond > 0) {
                cookies += cookiesPerSecond / 10;
                updateDisplay();
            } else {
                // Sjekker knapper kontinuerlig selv om du ikke har CPS enda
                updateDisplay();
            }
        }, 1000 / 10);
    </script>
</body>
</html>
