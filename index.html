<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a22;
    --border: #262c38;
    --text: #e8ebf1;
    --muted: #8b93a5;
    --accent: #4f8cff;
    --accent-2: #7b5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px;
    background-image: radial-gradient(circle at 50% -20%, rgba(79,140,255,0.18), transparent 60%);
  }
  header { text-align: center; margin-bottom: 48px; max-width: 640px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(79,140,255,0.35);
  }
  .logo svg { width: 32px; height: 32px; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin-top: 12px; font-size: 1.1rem; line-height: 1.5; }

  .list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    display: flex; align-items: center; gap: 18px;
    transition: transform .2s, border-color .2s;
    animation: fadeUp .5s ease both;
  }
  .item:hover { transform: translateY(-2px); border-color: #3a4357; }
  .icon {
    flex: none; width: 48px; height: 48px; border-radius: 12px;
    background: rgba(79,140,255,0.12); color: var(--accent);
    display: grid; place-items: center;
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
  }
  .info { flex: 1; min-width: 0; }
  .info h2 { font-size: 1.05rem; font-weight: 600; }
  .info p { color: var(--muted); font-size: .92rem; margin-top: 4px; line-height: 1.4; }
  .meta { color: var(--muted); font-size: .8rem; margin-top: 6px; }
  .btn {
    flex: none;
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; text-decoration: none;
    padding: 11px 18px; border-radius: 10px;
    font-weight: 600; font-size: .95rem;
    transition: filter .2s, transform .1s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; }

  footer { margin-top: auto; padding-top: 64px; color: var(--muted); font-size: .85rem; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  @media (max-width: 520px) {
    .item { flex-wrap: wrap; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
  </div>
  <h1 id="site-title"></h1>
  <p id="site-subtitle"></p>
</header>

<main class="list" id="list"></main>

<footer id="footer"></footer>

<script>
/* =========================================================
   EDIT THIS PART
   1. Put your file(s) in the "files" folder.
   2. Add one entry per file below.
   ========================================================= */
const SITE = {
  title: "Downloads",
  subtitle: "Grab the latest files below.",
  footer: "© 2026 — My downloads"
};

const FILES = [
  {
    name: "Pc Booster",                 // Name shown on the page
    description: "This is going to make your pc much faster.",
    file: "files/Pcbooster.exe",            // Path to the file in the "files" folder
    version: "v1.0",                      // Optional — delete the line if not needed
    size: "1 KB"                          // Optional — delete the line if not needed
  }
  // Add more like this:
  // ,{ name: "My App", description: "Windows installer", file: "files/myapp.exe", version: "v2.1", size: "24 MB" }
];
/* ========================================================= */

document.title = SITE.title;
document.getElementById("site-title").textContent = SITE.title;
document.getElementById("site-subtitle").textContent = SITE.subtitle;
document.getElementById("footer").textContent = SITE.footer;

const list = document.getElementById("list");
FILES.forEach((f, i) => {
  const ext = (f.file.split(".").pop() || "file").slice(0, 4);
  const meta = [f.version, f.size].filter(Boolean).join(" · ");
  const el = document.createElement("div");
  el.className = "item";
  el.style.animationDelay = (i * 0.08) + "s";
  el.innerHTML = `
    <div class="icon"></div>
    <div class="info">
      <h2></h2>
      <p></p>
      ${meta ? '<div class="meta"></div>' : ""}
    </div>
    <a class="btn" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download
    </a>`;
  el.querySelector(".icon").textContent = ext;
  el.querySelector("h2").textContent = f.name;
  el.querySelector("p").textContent = f.description || "";
  if (meta) el.querySelector(".meta").textContent = meta;
  el.querySelector(".btn").href = f.file;
  list.appendChild(el);
});
</script>
</body>
</html>
